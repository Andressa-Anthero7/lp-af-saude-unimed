version: '3'

services:
  web:
    image: my-django-image
    build:
      context: .
    command: gunicorn myproject.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    expose:
      - "8000"  # A porta que o Gunicorn irá escutar dentro do contêiner

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Montando o arquivo de configuração do Nginx
      - ./static:/app/static  # Caso tenha arquivos estáticos
    ports:
      - "80:80"  # Porta pública onde o Nginx escutará
    depends_on:
      - web  # Garante que o serviço web seja iniciado antes do Nginx
